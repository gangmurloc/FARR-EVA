[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "farr-eva-research"
version = "0.1.0"
description = "Research code for evidence-vector arbitration over multi-hop QA experts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "datasets",
  "huggingface-hub",
  "joblib",
  "numpy",
  "scikit-learn",
  "torch",
  "tqdm",
  "transformers",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["farr*", "farr_star*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

